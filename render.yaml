# Render Blueprint — deploy semua service (backend, frontend, Postgres, Redis)
# sekaligus lewat "New > Blueprint" di dashboard Render. Tidak perlu kartu kredit
# untuk tier free. https://render.com/docs/blueprint-spec

databases:
  - name: dhuknoo-db
    plan: free
    databaseName: dhuknoo
    user: dhuknoo

services:
  # Backend API (Express + Prisma)
  - type: web
    name: dhuknoo-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dhuknoo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dhuknoo-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://dhuknoo-frontend.onrender.com

  # Frontend (React + Vite, static build)
  - type: web
    name: dhuknoo-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Vite membakar env ini saat build, isi URL backend di atas.
      - key: VITE_API_URL
        value: https://dhuknoo-backend.onrender.com
      - key: VITE_API_BASE_URL
        value: https://dhuknoo-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Redis (Render Key Value, kompatibel Redis) — tier free bersifat in-memory,
  # data hilang saat restart. Cukup untuk uji publik, bukan untuk produksi.
  - type: keyvalue
    name: dhuknoo-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all (testing)
