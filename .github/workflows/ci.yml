name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend - validate, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dhuknoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dhuknoo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dhuknoo_test?schema=public
      JWT_SECRET: ci_test_jwt_secret
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run prisma:generate

      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate

      - name: Apply Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Unit tests
        working-directory: backend
        run: npx jest tests/unit --runInBand

      - name: Integration tests
        working-directory: backend
        run: npx jest tests/integration --runInBand

      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend - typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm install

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend build
        working-directory: frontend
        run: npm run build