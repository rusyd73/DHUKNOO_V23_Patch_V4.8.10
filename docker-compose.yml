version: '3.8'

# 🆕 FIX "Docker secrets" (audit lanjutan): SEBELUMNYA semua secret di
# file ini (password Postgres, JWT_SECRET, JWT_REFRESH_SECRET, password
# admin Grafana) ditulis LANGSUNG sebagai nilai plain-text di sini --
# file ini ikut TER-COMMIT ke git, artinya secret-secret itu SUDAH
# PUBLIK/beredar untuk siapa pun yang punya akses ke repo (persis
# situasi audit ini). Kalau ada deployment nyata yang benar-benar
# memakai docker-compose.yml ini apa adanya, secret itu sudah bocor
# sejak awal.
#
# Sekarang SEMUA nilai secret memakai interpolasi ${VAR_NAME} yang
# dibaca dari file `.env` di direktori yang sama (TIDAK ikut ter-commit
# -- sudah ada di .gitignore) atau dari environment shell/CI/CD secret
# manager. Lihat `.env.example` untuk daftar variabel yang wajib diisi
# sebelum `docker compose up`. env.ts (backend) sendiri sudah hard-fail
# di production kalau JWT_SECRET/JWT_REFRESH_SECRET kosong atau masih
# nilai default yang diketahui -- combo kedua fix ini menutup celahnya
# dari dua sisi (kode DAN infrastruktur).
services:
  postgres:
    image: postgres:15-alpine
    container_name: obama-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: obama-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: obama-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: obama-prometheus
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    container_name: obama-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
