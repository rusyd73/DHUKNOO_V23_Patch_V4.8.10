services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhuknoo
      POSTGRES_PASSWORD: dhuknoo_password
      POSTGRES_DB: dhuknoo
    ports:
      - "5432:5432"
    volumes:
      - dhuknoo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhuknoo -d dhuknoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dhuknoo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dhuknoo-postgres:
  dhuknoo-redis:
